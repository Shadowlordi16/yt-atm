<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT ATM Render Desk</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#13171c;--line:#29313a;--text:#f5f7fa;--muted:#9aa6b2;--accent:#8ee6b2;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#17231d 0,#0b0d10 35%);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1080px;margin:0 auto;padding:56px 28px 80px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:28px}.top h1{font-size:42px;line-height:1;margin:10px 0 0}.top p{color:var(--muted);margin:10px 0 0}.badge{border:1px solid #355040;color:var(--accent);border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap}.toolbar{display:flex;gap:12px;margin:28px 0 18px}.toolbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--text);outline:none}.toolbar button{background:var(--accent);color:#07120b;border:0;border-radius:10px;padding:0 16px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.card{background:rgba(19,23,28,.9);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;min-height:150px}.card h2{font-size:18px;margin:0 0 8px;word-break:break-word}.path{color:var(--muted);font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;flex:1}.actions{display:flex;gap:8px;margin-top:18px}.actions button,.actions a{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#1b222a;color:var(--text);text-decoration:none;cursor:pointer;font-weight:700}.actions button.primary{background:var(--accent);border-color:var(--accent);color:#07120b}.status{min-height:24px;color:var(--warn);margin:12px 0}.empty{color:var(--muted);padding:30px 0}.foot{color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:640px){main{padding:34px 16px}.top{display:block}.top h1{font-size:34px}.badge{display:inline-block;margin-top:20px}}
</style></head>
<body><main><div class="top"><div><div class="eyebrow">YT ATM · Render Desk</div><h1>Choose a video. Render it.</h1><p>Vercel hosts this dashboard. GitHub Actions does the heavy render.</p></div><div class="badge" id="count">Detecting projects…</div></div><div class="toolbar"><input id="search" placeholder="Filter projects…"><button id="refresh">Refresh</button></div><div class="status" id="status"></div><section class="grid" id="grid"></section><div class="foot">Render jobs appear in GitHub Actions. Download the finished MP4 from the workflow artifact.</div></main>
<script>
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count'),status=document.querySelector('#status');let projects=[];
function draw(){const q=search.value.toLowerCase();const shown=projects.filter(p=>p.label.toLowerCase().includes(q));count.textContent=`${shown.length} project${shown.length===1?'':'s'} detected`;grid.innerHTML=shown.map(p=>`<article class="card"><h2>${p.label}</h2><div class="path">${p.id}/video</div><div class="actions"><button class="primary" data-render="${p.id}">Render MP4</button><a href="${p.preview}" target="_blank" rel="noreferrer">Preview</a></div></article>`).join('')||'<div class="empty">No matching projects.</div>';document.querySelectorAll('[data-render]').forEach(b=>b.onclick=()=>render(b.dataset.render));}
async function load(){status.textContent='';const r=await fetch('/projects.json?'+Date.now());const d=await r.json();projects=d.projects||[];draw();}
async function render(project){status.textContent=`Dispatching ${project}…`;const r=await fetch('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({project})});const d=await r.json();status.textContent=r.ok?`Render started for ${project}. Open GitHub Actions to follow it.`:(d.error||'Render failed');if(r.ok)window.open(d.actionsUrl,'_blank','noopener');}
search.oninput=draw;document.querySelector('#refresh').onclick=load;load();
</script></body></html>

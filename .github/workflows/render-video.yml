name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder, for example blockbuster or football-channel/episodes/coutinho'
        required: true
        type: string
      output_name:
        description: 'Artifact name'
        required: false
        default: final-video
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          npx --yes hyperframes@latest browser ensure --force

      - name: Build composition
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          test -d "$PROJECT/video"
          cd "$PROJECT"
          python3 ../kit/lines.py
          cd video
          python3 build.py
          python3 ../../kit/mix.py
          npx --yes hyperframes@latest lint --json

      - name: Render MP4
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          cd "$PROJECT/video"
          npx --yes hyperframes@latest render --fps 24 --quality looks -o renders/_raw.mp4
          ffmpeg -v error -y -i renders/_raw.mp4 \
            -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 \
            -c:v copy -c:a aac -b:a 192k renders/final.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=nw=1 renders/final.mp4

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.project }}/video/renders/final.mp4
          retention-days: 3
          if-no-files-found: error
